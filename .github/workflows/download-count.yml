# Counts how many times the installer (OmniGlass-OS-<version>-x64-setup.exe) has been downloaded, across every release, and writes the
# number to badges/installer-downloads.json for the README badge. update-check files (latest.json) and checksums are not counted.
# Runs every six hours, after each release is published, and by hand. GitHub counts downloads, not different people.
name: download-count
on:
  schedule: [{ cron: '17 */6 * * *' }]
  release: { types: [published] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # a release event would otherwise check out the tag (a detached HEAD that cannot be pushed)
      - name: Count installer downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].assets[] | select(.name | test("-x64-setup\\.exe$")) | .download_count' | paste -sd+ - | bc)
          n=${n:-0}
          mkdir -p badges
          printf '{"schemaVersion":1,"label":"installer downloads","message":"%s","color":"E8B84A"}\n' "$n" > badges/installer-downloads.json
          echo "Installer downloads: $n"
      - name: Save it
        # main only accepts pull requests, so the number lives on its own branch, "badges", which the README badge reads.
        run: |
          mkdir -p /tmp/b && cp badges/installer-downloads.json /tmp/b/
          git checkout -q --orphan badges
          git rm -rfq . >/dev/null 2>&1 || true
          cp /tmp/b/installer-downloads.json .
          git add installer-downloads.json
          git -c user.name=gh-ringmaster-adm -c user.email=gh-ringmaster-adm@users.noreply.github.com commit -qm "Installer download count"
          git push -f origin badges
